version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Portfolio Platform — Docker Compose (local development)
# ─────────────────────────────────────────────────────────────────────────────
# Start everything:   make dev   (or: docker compose up -d)
# Stop everything:    make down
# View logs:          make logs
# Run migrations:     make migrate
# ─────────────────────────────────────────────────────────────────────────────

x-api-env: &api-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/portfolio_db
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    S3_ENDPOINT_URL: http://minio:9000
    SMTP_HOST: mailhog
    SMTP_PORT: "1025"

services:
  # ── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portfolio_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: portfolio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # MinIO bucket initializer (runs once, then exits)
  minio-init:
    image: minio/mc:latest
    container_name: portfolio_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/portfolio-media &&
        mc anonymous set download local/portfolio-media &&
        echo 'MinIO bucket ready.'
      "
    networks:
      - backend
    restart: "no"

  # ── Mailhog (email testing) ────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: portfolio_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - backend

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: final
    container_name: portfolio_api
    restart: unless-stopped
    <<: *api-env
    # Run migrations then start the server
    command: |
      sh -c "
        echo 'Waiting for DB...' &&
        python -c \"
      import asyncio, asyncpg, os, time
      async def wait():
          url = os.environ['DATABASE_URL'].replace('postgresql+asyncpg://', 'postgresql://')
          for i in range(30):
              try:
                  conn = await asyncpg.connect(url)
                  await conn.close()
                  print('DB is ready.')
                  return
              except Exception as e:
                  print(f'Attempt {i+1}/30: {e}')
                  time.sleep(2)
          raise SystemExit('DB never became ready')
      asyncio.run(wait())
        \" &&
        alembic upgrade head &&
        uvicorn main:app --reload --host 0.0.0.0 --port 8000 --log-level debug
      "
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend
      - frontend

  # ── Celery worker (video processing) ─────────────────────────────────────
  worker:
    build:
      context: ./workers/video-processor
      dockerfile: Dockerfile
    container_name: portfolio_worker
    restart: unless-stopped
    <<: *api-env
    command: celery -A worker worker --loglevel=debug --concurrency=2 -Q video,default
    volumes:
      - ./workers/video-processor:/app
      - worker_tmp:/tmp/video-work
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/portfolio_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: portfolio-media
    networks:
      - backend

  # ── Celery Flower (task monitor) ──────────────────────────────────────────
  flower:
    build:
      context: ./workers/video-processor
      dockerfile: Dockerfile
    container_name: portfolio_flower
    restart: unless-stopped
    command: celery -A worker flower --port=5555 --broker=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    networks:
      - backend

  # ── React frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    container_name: portfolio_web
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: /ws
      VITE_APP_NAME: "Portfolio & Tech Takeaway"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - frontend

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  worker_tmp:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
