server {
    listen 80;
    server_name localhost;

    # ── API proxy (/api/ and /docs, /redoc, /openapi.json) ────────────────────
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts — generous for file uploads
        proxy_connect_timeout  30s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           4 64k;
        proxy_busy_buffers_size 128k;
    }

    # FastAPI interactive docs
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (direct to API, no frontend fallback)
    location /health {
        proxy_pass         http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── WebSocket proxy (/ws/) ────────────────────────────────────────────────
    location /ws/ {
        proxy_pass             http://api_backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_connect_timeout  10s;
    }

    # ── Static media / uploaded files (served by MinIO in dev) ───────────────
    location /media/ {
        proxy_pass         http://minio:9000/portfolio-media/;
        proxy_http_version 1.1;
        proxy_set_header   Host              minio:9000;

        # Cache public media aggressively
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400, immutable";
        expires            1d;
    }

    # ── React frontend (catch-all — must be last) ─────────────────────────────
    location / {
        proxy_pass         http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required for Vite HMR websocket in dev
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Custom error pages ────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
